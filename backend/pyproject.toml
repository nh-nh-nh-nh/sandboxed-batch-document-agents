[project]
name = "sbda"
version = "0.1.0"
description = "Sandboxed Batch Document Agents — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "temporalio>=1.7",
    "anthropic>=0.34",
    "modal>=0.64",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "freezegun>=1.5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "openpyxl>=3.1,<3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbda"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]

[tool.coverage.run]
source = ["src/sbda"]

[tool.coverage.report]
fail_under = 0

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()-in-default-argument is idiomatic

[tool.uv]
# cbor2 6.x has no prebuilt wheel available here and its sdist needs a Rust
# toolchain with the (unstabilized) edition2024 feature; pin to the last
# release with wheels for this environment.
override-dependencies = ["cbor2==5.6.5", "cryptography==43.0.3"]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "freezegun>=1.5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "openpyxl>=3.1,<3.2",
]
