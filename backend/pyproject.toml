[project]
name = "sbda"
version = "0.1.0"
description = "Sandboxed Batch Document Agents"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7.0",
    "modal>=0.64.0",
    "anthropic>=0.40.0",
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "freezegun>=1.5.0",
    "moto[s3]>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbda"]
